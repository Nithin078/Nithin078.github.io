<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Nithin Kumar Reddy">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ba3e0"/>
      <stop offset="48%" stop-color="#a8d0ef"/>
      <stop offset="52%" stop-color="#7cb342"/>
      <stop offset="100%" stop-color="#3d7a1f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c81f3"/>
      <stop offset="100%" stop-color="#0c4cb8"/>
