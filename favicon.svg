  </defs>
  <!-- XP window -->
  <rect x="2" y="3" width="28" height="26" rx="3" fill="#ece9d8" stroke="#245edb" stroke-width="1.5"/>
  <rect x="2" y="3" width="28" height="8" rx="3" fill="url(#bar)"/>
  <rect x="2" y="8" width="28" height="3" fill="url(#bar)"/>
  <!-- close button -->
  <rect x="23" y="5" width="5" height="4" rx="0.8" fill="#c63b2d"/>
  <!-- bliss mini -->
  <rect x="5" y="13" width="22" height="13" rx="1" fill="url(#sky)"/>
  <!-- N monogram -->
  <text x="16" y="23.5" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="11" font-weight="700" fill="#0a246a">N</text>
</svg>
